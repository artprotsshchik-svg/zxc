[package]
name = "verstak-sborok"
version = "0.1.0"
description = "Верстак сборок — десктопное приложение на Rust (Tauri)"
authors = ["artprotsshchik-svg"]
edition = "2021"

[lib]
name = "verstak_sborok_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
